[package]
name = "encrypt"
version = "0.1.0"
edition = "2021"
description = "Secure encryption services for Securely server"

[dependencies]
aes = "0.7.5"
block-modes = "0.8.1"
block-padding = "0.2.1"
base64 = "0.21.5"
hmac = "0.12"
sha2 = "0.10"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
dotenv = "0.15"
lazy_static = "1.4"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }
pretty_assertions = "1.4"
assert_fs = "1.0"
predicates = "3.0"
