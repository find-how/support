[package]
name = "encrypt"
version = "0.1.0"
edition = "2021"
description = "Encryption utilities for Securely"
license = "MIT"

[dependencies]
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
base64 = "0.21"
dotenv = "0.15"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
getrandom = "0.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"
assert_fs = "1.0"
predicates = "3.0"
tokio-test = "0.4"
