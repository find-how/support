[package]
name = "queue"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.8"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
tempfile = "3.8"
testing = { path = "../testing" }
tokio = { version = "1.32", features = ["full"] }
uuid = { version = "1.5", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
