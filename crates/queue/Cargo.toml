[package]
name = "queue"
version = "0.1.0"
edition = "2021"
description = "Job queuing and processing with sled backend"
license = "MIT"

[dependencies]
async-trait = "0.1"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"
assert_fs = "1.0"
predicates = "3.0"
tokio-test = "0.4"
