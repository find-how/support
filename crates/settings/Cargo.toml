[package]
name = "settings"
version = "0.1.0"
edition = "2021"
description = "Secure settings management CLI for securely projects"
license = "MIT"

[dependencies]
sled = "0.34"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
aes = "0.8"
block-modes = "0.9"
rand = "0.8"
base64 = "0.21"
lazy_static = "1.4"
petgraph = "0.6"
dirs = "5.0"
dotenv = "0.15"
hex = "0.4"

[dev-dependencies]
tempfile = "3.2"
proptest = "1.0"
criterion = "0.5"
pretty_assertions = "1.3"
assert_fs = "1.0"
predicates = "3.0"

[[bin]]
name = "settings"
path = "src/main.rs"
