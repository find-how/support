[package]
name = "settings"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.5"
store = { path = "../store" }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.8"
assert_fs = "1.0"
