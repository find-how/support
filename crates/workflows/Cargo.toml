[package]
name = "workflows"
version = "0.1.0"
edition = "2021"

[dependencies]
store = { path = "../store" }
config = { path = "../config" }
async-trait = "0.1"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
dashmap = "5.5"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
once_cell = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.32", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.7", features = ["serde", "v4"] }
warp = "0.3"

[dev-dependencies]
testing = { path = "../testing" }
tempfile = "3.8"
tokio-test = "0.4"
