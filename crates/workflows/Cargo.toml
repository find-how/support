[package]
name = "securely-workflows"
version = "0.1.0"
edition = "2021"
description = "Laravel-inspired workflow engine for Securely server"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.1", features = ["derive"] }
cron = "0.7"
dashmap = "5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
thiserror = "1.0"
tokio = { version = "1.25", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }
bincode = "1.3"
once_cell = "1.17"

# Optional: for metrics
metrics-exporter-prometheus = "0.10"
warp = "0.3"

[dev-dependencies]
tempfile = "3.2"
proptest = "1.0"
criterion = "0.5"
pretty_assertions = "1.3"
assert_fs = "1.0"
predicates = "3.0"

[[bin]]
name = "workflows"
path = "src/main.rs"
