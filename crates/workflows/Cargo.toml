[package]
name = "workflows"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
cron = "0.12"
dashmap = "5.5"
env_logger = "0.10"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["serde", "v4"] }
warp = "0.3"

[dev-dependencies]
tokio-test = "0.4"
