[package]
name = "testing"
version = "0.1.0"
edition = "2021"

[dependencies]
store = { path = "../store" }
settings = { path = "../settings" }
config = { path = "../config" }
async-trait = "0.1"
base64 = "0.21"
bincode = "1.3"
bytes = "1.5"
criterion = "0.5"
proptest = "1.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
thiserror = "1.0"
tokio = { version = "1.32", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
