[package]
name = "testing"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
proptest = "1.0"
criterion = { version = "0.5", features = ["async_tokio"] }
async-trait = "0.1"
futures = "0.3"
