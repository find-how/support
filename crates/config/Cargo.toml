[package]
name = "config"
version = "0.1.0"
edition = "2021"
description = "Configuration management with Laravel-inspired patterns"
license = "MIT"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
testing = { path = "../testing" }
tempfile = "3.8"
tokio-test = "0.4"
pretty_assertions = "1.4"
