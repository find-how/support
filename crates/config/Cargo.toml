[package]
name = "config"
version = "0.1.0"
edition = "2021"

[dependencies]
store = { path = "../store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
dotenv = "0.15"

[dev-dependencies]
testing = { path = "../testing" }
tempfile = "3.8"
tokio-test = "0.4"
pretty_assertions = "1.4"
