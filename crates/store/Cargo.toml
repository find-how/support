[package]
name = "store"
version = "0.1.0"
edition = "2021"
description = "Storage abstraction with Laravel-inspired patterns"
license = "MIT"

[dependencies]
async-trait = "0.1"
bytes = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
pretty_assertions = "1.4"
