[package]
name = "store"
version = "0.1.0"
edition = "2021"

[dependencies]
sled = { version = "0.34", optional = true }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"
rstest = "0.16"
pretty_assertions = "1.3"
assert_fs = "1.0"
predicates = "2.1"
tempfile = "3.3"
criterion = "0.4"

[features]
default = ["sled-store"]
sled-store = ["sled"]
sqlite-store = []

[[bench]]
name = "store_benchmarks"
harness = false
