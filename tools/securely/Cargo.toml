[package]
name = "rust-fastcgi-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.25", features = ["full"] }
bytes = "1.4"
log = "0.4"
env_logger = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hickory-resolver = { version = "0.24", features = ["system-config"] }
tracing = "0.1"
num_cpus = "1.16"
dirs = "5.0"
pingora = { version = "0.4" }
pingora-core = "0.4"
pingora-proxy = "0.4"
pingora-error = "0.4"
tokio-fastcgi = "1.2.0"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
